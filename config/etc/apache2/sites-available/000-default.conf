# =============================================================================
#  /etc/apache2/sites-available/000-default.conf — Sitio web (consignas 2.3 y 4.3)
# =============================================================================
#  Es el "VirtualHost" que Apache usa por defecto: define DESDE QUÉ CARPETA se
#  sirve la página cuando alguien entra a http://IP-de-la-VM
#
#  Cambio del TP: DocumentRoot pasa de /var/www/html a /www_dir (la partición
#  de 3 GB del disco nuevo), donde dejamos index.php y logo.png.
#
#  IMPORTANTE: Esto solo no alcanza: Apache por seguridad NO deja servir carpetas que
#     no estén permitidas en /etc/apache2/apache2.conf. Ver el archivo
#     apache2.conf.fragmento de esta misma carpeta.
# =============================================================================

# Escucha en el puerto 80 (HTTP) en todas las IPs de la máquina ("*").
<VirtualHost *:80>

    # Mail del administrador (aparece en algunas páginas de error).
    ServerAdmin webmaster@localhost

    # CARPETA DEL SITIO. Antes: /var/www/html  →  Ahora: /www_dir
    DocumentRoot /www_dir

    # Archivo que se abre al entrar a la carpeta sin pedir uno en particular.
    # Ponemos index.php primero para que sea la página de inicio.
    DirectoryIndex index.php index.html

    # Dónde guarda Apache los errores y los accesos.
    # ${APACHE_LOG_DIR} = /var/log/apache2 (se define en /etc/apache2/envvars).
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>

# Después de guardar:
#   apache2ctl configtest      ← tiene que decir "Syntax OK"
#   systemctl reload apache2   ← aplica los cambios sin cortar el servicio
