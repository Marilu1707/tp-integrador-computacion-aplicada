# =============================================================================
#  /etc/ssh/sshd_config.d/tp.conf — Configuración del servidor SSH (consigna 2.2)
# =============================================================================
#  Por qué un archivo aparte y no editar /etc/ssh/sshd_config:
#    En Debian 12 el archivo principal empieza con
#        Include /etc/ssh/sshd_config.d/*.conf
#    y en SSH gana el PRIMER valor que se lee. Entonces lo que pongamos acá
#    tiene prioridad, y el archivo original queda intacto (si algo sale mal,
#    alcanza con borrar este archivo).
#
#  La consigna pide: que root pueda entrar por SSH usando clave pública/privada.
# =============================================================================

# PermitRootLogin: ¿root puede iniciar sesión por SSH?
#   yes                 → sí, con contraseña o con clave (inseguro)
#   no                  → nunca
#   prohibit-password   → sí, pero SOLO con clave (sin contraseña)  ← elegimos esta
# Con "prohibit-password" cumplimos la consigna y evitamos que alguien pruebe
# contraseñas de root a la fuerza desde la red.
PermitRootLogin prohibit-password

# Habilita el login con par de claves (pública en el servidor, privada en el
# cliente). Por defecto ya viene en "yes", pero lo dejamos explícito.
PubkeyAuthentication yes

# Archivo donde el servidor busca las claves públicas autorizadas de cada
# usuario. Para root es /root/.ssh/authorized_keys.
AuthorizedKeysFile .ssh/authorized_keys

# Después de guardar:
#   sshd -t                      ← revisa que no haya errores de sintaxis (si no dice nada, está bien)
#   systemctl restart ssh        ← reinicia el servicio para aplicar los cambios
#   sshd -T | grep -i root       ← muestra el valor que quedó activo
